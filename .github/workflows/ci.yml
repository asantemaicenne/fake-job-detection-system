# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Formatting with Black
        run: |
          black --check src configs tests

      - name: Lint with Flake8
        run: |
          # Stop the build on critical errors or undefined names
          flake8 src configs tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning checks with line length threshold
          flake8 src configs tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Static Type Checking with Mypy
        run: |
          mypy src configs --ignore-missing-imports

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017/
          MONGODB_DB_NAME: test_job_detection
          JWT_SECRET_KEY: test_dummy_secret_key_for_ci_pipeline
        run: |
          pytest tests/ -v --durations=10
